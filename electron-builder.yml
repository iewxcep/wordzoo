appId: com.wordzoo.app
productName: WordZoo
copyright: WordZoo desktop

directories:
  output: release
  buildResources: build

files:
  - dist/main.js
  - dist/preload.js
  - package.json

# better-sqlite3 is required at runtime by resources/api.cjs. Node resolves
# from <install>/resources/node_modules upward — the copy inside app.asar is
# NOT on that path. Ship the runtime module tree as plain files next to
# api.cjs. native/win/node_modules holds the Windows electron-ABI prebuild
# (PE32+ .node); npmRebuild stays off. Linux dev runs use the workspace ELF
# build that scripts/sync-resources.mjs copies into resources/node_modules.
npmRebuild: false

extraResources:
  - from: resources/api.cjs
    to: api.cjs
  - from: resources/migrations
    to: migrations
  - from: resources/courses-data
    to: courses-data
  - from: resources/renderer
    to: renderer
  - from: native/win/node_modules/better-sqlite3
    to: node_modules/better-sqlite3
  - from: native/win/node_modules/bindings
    to: node_modules/bindings
  - from: native/win/node_modules/file-uri-to-path
    to: node_modules/file-uri-to-path
  # koffi（N-API，无 ABI 之分）：dist/main.js 里 require("koffi") 在打包后沿
  # app.asar 向上解析到 <install>/resources/node_modules/koffi；其加载器再从
  # resources/node_modules/koffi/build/win32_x64/koffi.node 取原生模块。
  - from: native/win/node_modules/koffi
    to: node_modules/koffi

# course-pack 技能（SKILL.md + scripts/validate.py）：extraFiles 拷到安装根
# 目录（Windows/Linux 下与 WordZoo.exe 同级），帮助页向 AI 助手指路时引用
# <安装目录>/course-pack/SKILL.md。
extraFiles:
  - from: resources/course-pack
    to: course-pack

win:
  target:
    - nsis
    - zip
  icon: build/icon.ico
  # Cross-building on Linux: skip exe signing/rcedit (requires wine).
  # electron-builder 不改 exe 图标；build/icon.ico 由 scripts/patch-exe-icon.mjs
  # 在打包后写进 WordZoo.exe 的 RT_GROUP_ICON（见 package.json postbuild）。
  signAndEditExecutable: false

# Microsoft Store（Partner Center → 应用管理 → App identity）。
# identityName / publisher 必须与 Partner Center 预留的名字一致，商店上传后自动代签。
appx:
  applicationId: WordZoo.App
  identityName: tonghua.WordZoo
  publisher: CN=6E117548-D05C-4369-83B7-02F2909F4A2D
  publisherDisplayName: tonghua
  displayName: 字游 WordZoo
  languages:
    - zh-CN
    - en-US

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: WordZoo-Setup-${version}.${ext}
